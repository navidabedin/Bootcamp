<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seasons Gallery</title>

<link rel="stylesheet" href="link.css">
</head>
<body>

<header>
  <h1>Seasons Gallery</h1>
</header>

<main>
  <nav>
    <a href="#home">Home</a>
    <a href="#spring">Spring</a>
    <a href="#summer">Summer</a>
    <a href="#autumn">Autumn</a>
    <a href="#winter">Winter</a>
  </nav>

  <section class="cards">

    <figure class="card" id="spring">
      <img src="spring.jpg" alt="Spring season">
      <figcaption>Spring</figcaption>
      <p>Flowers bloom and days grow warmer.
        <br>
        <span class="link">Learn more</span>
      </p>
    </figure>

    <figure class="card" id="summer">
      <img src="summer.jpg" alt="Summer season">
      <figcaption>Summer</figcaption>
      <p>Long sunny days perfect for the beach.
         <br>
        <span class="link">Learn more</span>
      </p>
    </figure>

    <figure class="card" id="autumn">
      <img src="autumn.jpg" alt="Autumn season">
      <figcaption>Autumn</figcaption>
      <p>Leaves turn golden and air feels crisp.
         <br>
        <span class="link">Learn more</span>
      </p>
    </figure>

    <figure class="card" id="winter">
      <img src="winter.jpg" alt="Winter season">
      <figcaption>Winter</figcaption>
      <p>Snow falls and the world turns white.
         <br>
        <span class="link">Learn more</span>
      </p>
    </figure>

  </section>
</main>

<footer>
  <p>&copy; 2026 Seasons Gallery. All rights reserved.</p>
</footer>

</body>
</html>

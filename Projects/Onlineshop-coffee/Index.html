<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>کافی‌بار</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header class="header">

    <div class="header__inner">

      <a href="index.html" class="header__logo"> <img src="img/coffee-beans.png" alt="coffee-beans" class="logo">کافی‌بار</a>

      <nav class="header__nav">

        <a href="index.html" class="header__link header__link--active">کاتالوگ</a>

        <a href="configurator.html" class="header__link">ترکیب اختصاصی</a>

        <button class="header__cart-btn" id="cartBtn" aria-label="سبد خرید">

          🛒 <span id="cartCount">0</span>

        </button>

      </nav>

    </div>

  </header>

  <main class="main">






    <section class="hero">

      <img src="img/coffee-backs.webp" alt="hero-background" class="hero-background">

      <div
       class="hero__content">

        <h1 class="hero__title">قهوه‌ی دلخواهت را انتخاب کن</h1>

        <p class="hero__subtitle">از بهترین مزارع دنیا، مستقیم به فنجان تو</p>

        <a href="configurator.html" class="btn btn--primary">ساخت ترکیب اختصاصی</a>

      </div>

    </section>


    <section class="catalog">

      <h2 class="catalog__title">محصولات ما</h2>

        <div class="catalog__filters">

            <button class="filter-btn filter-btn--active" data-filter="all">همه</button>

            <button class="filter-btn" data-filter="arabica">عربیکا</button>

            <button class="filter-btn" data-filter="robusta">روبوستا</button>

        </div>

      <div class="catalog__grid" id="catalogGrid">

      </div>

    </section>


  </main>

  <div class="cart-sidebar" id="cartSidebar" aria-hidden="true">

    <div class="cart-sidebar__header">

      <h2>سبد خرید</h2>

      <button class="cart-sidebar__close" id="cartClose" aria-label="بستن">✕</button>

    </div>

    <div class="cart-sidebar__items" id="cartItems">

    </div>

    <div class="cart-sidebar__footer">

      <p class="cart-sidebar__total">جمع کل: <strong id="cartTotal">۰</strong> تومان</p>

      <button class="btn btn--primary btn--full" id="checkoutBtn">ثبت سفارش</button>

    </div>

  </div>





  <div class="overlay" id="overlay"></div>

        <footer class="footer">

            <p>&copy; ۱۴۰۵ کافی‌بار — تهران</p>

        </footer>

        <script type="module" src="js/pages/catalog.js"></script>

    </body>

</html>

<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ترکیب سفارشی | کافی‌بار</title>
  <link rel="stylesheet" href="css/style.css" />
</head>


<body>

  <header class="header">

    <div class="header__inner">

      <a href="home.html" class="header__logo"> <img src="img/coffee-beans.png" alt="coffee-beans" class="logo">کافه‌بار</a>

      <nav class="header__nav">

        <a href="home.html" class="header__link">کاتالوگ</a>

        <a href="configurator.html" class="header__link header__link--active">ترکیب اختصاصی</a>

        <button class="header__cart-btn" id="cartBtn" aria-label="سبد خرید">

          🛒 <span id="cartCount">0</span>

        </button>

      </nav>

    </div>

  </header>



  <main class="main">

    <div class="configurator">

      <h1 class="configurator__title">ساخت ترکیب اختصاصی</h1>

      <div class="configurator__layout">
        <!-- ستون راست: خلاصه -->
        <div class="configurator__options">

          <fieldset class="config-section">
            <legend class="config-section__title">عربیکا</legend>
            <div class="config-section__grid" id="arabicaGrid"></div>
          </fieldset>

          <fieldset class="config-section">
            <legend class="config-section__title">روبوستا</legend>
            <div class="config-section__grid" id="robustaGrid"></div>
          </fieldset>

          <fieldset class="config-section">
            <legend class="config-section__title">نسبت ترکیب (روبوستا / عربیکا)</legend>
            <div class="blend-ratios" id="blendRatios"></div>
          </fieldset>

          <fieldset class="config-section">
            <legend class="config-section__title">شکل محصول</legend>
            <div class="form-toggle">
              <label class="form-toggle__item">
                <input type="radio" name="form" value="bean" checked />دانه
              </label>
              <label class="form-toggle__item">
                <input type="radio" name="form" value="ground" />پودر
              </label>
            </div>
          </fieldset>

          <fieldset class="config-section">
            <legend class="config-section__title">وزن بسته</legend>
            <div class="weight-options" id="weightOptions"></div>
          </fieldset>

          <fieldset class="config-section">
            <legend class="config-section__title">تعداد بسته</legend>
            <div class="quantity-control">
              <button class="quantity-control__btn" id="qtyMinus" aria-label="کاهش">−</button>
              <input class="quantity-control__input" type="number" id="qtyInput" value="1" min="1" max="9" />
              <button class="quantity-control__btn" id="qtyPlus" aria-label="افزایش">+</button>
            </div>
          </fieldset>

        </div>

                        <!-- ستون چپ: انتخاب -->
                        <aside class="configurator__summary">
                            <div class="summary-card">
                                <h2 class="summary-card__title">خلاصه سفارش</h2>
                                  <ul class="summary-card__list" id="summaryList">
                                    <li>عربیکا: <span id="s-arabica">—</span></li>
                                    <li>روبوستا: <span id="s-robusta">—</span></li>
                                    <li>نسبت: <span id="s-ratio">—</span></li>
                                    <li>شکل: <span id="s-form">دانه</span></li>
                                    <li>وزن: <span id="s-weight">—</span></li>
                                    <li>تعداد: <span id="s-qty">۱</span></li>
                                  </ul>
                              <div class="summary-card__price">
                                <span>قیمت نهایی:</span>
                                <strong id="s-price">—</strong>
                                <span>تومان</span>
                                </div>
                                <button class="btn btn--primary btn--full" id="addToCartBtn" disabled>
                                افزودن به سبد
                                </button>
                            </div>
                        </aside>
      </div>
    </div>
  </main>




  <div class="cart-sidebar" id="cartSidebar" aria-hidden="true">
    <div class="cart-sidebar__header">
      <h2>سبد خرید</h2>
      <button class="cart-sidebar__close" id="cartClose" aria-label="بستن">✕</button>
    </div>
    <div class="cart-sidebar__items" id="cartItems"></div>
    <div class="cart-sidebar__footer">
      <p class="cart-sidebar__total">جمع کل: <strong id="cartTotal">۰</strong> تومان</p>
      <button class="btn btn--primary btn--full" id="checkoutBtn">ثبت سفارش</button>
    </div>
  </div>

  
  <div class="overlay" id="overlay"></div>


                <footer class="footer">
                    <p>© ۱۴۰۵ قهوه‌فروشی — تهران</p>
                </footer>


    <script type="module" src="js/pages/configurator-page.js"></script>

    </body>
</html>
